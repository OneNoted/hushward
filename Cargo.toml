[package]
name = "hushward"
version = "0.1.0"
edition = "2024"
description = "A local ward against noise, powered by NVIDIA NemotronLabs RE-USE"
license = "MIT"
readme = "README.md"
repository = "https://github.com/OneNoted/hushward"
keywords = ["audio", "noise-suppression", "pipewire", "speech", "linux"]
categories = ["command-line-utilities", "multimedia::audio"]
publish = false

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
ctrlc = { version = "3", features = ["termination"] }
hound = "3.5"
rayon = "1.12"
reuse-rs = { path = "vendor/reuse-rs", version = "0.4.0" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
toml = { version = "1.2", default-features = false, features = ["parse", "display", "serde", "std"] }

[features]
default = ["vulkan"]
vulkan = ["reuse-rs/vulkan"]

[profile.release]
lto = "thin"
strip = "debuginfo"


[workspace]
members = ["vendor/reuse-rs"]
resolver = "3"
